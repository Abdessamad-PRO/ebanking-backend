spring.application.name=ebanking-backend
#spring.datasource.url=jdbc:h2:mem:bank
#spring.h2.console.enabled=true
server.port=8085
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=user

spring.datasource.url=jdbc:mysql://localhost:3306/EBANK?createDatabaseIfNotExist=true

spring.datasource.username=root
spring.datasource.password=


# Hibernate : crée ou met à jour les tables automatiquement à partir de tes @Entity
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=create 

# à chaque fois j'ecrase la base de donnée

# Pour voir les requêtes SQL générées par Spring dans la console (très utile pour débugger)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver